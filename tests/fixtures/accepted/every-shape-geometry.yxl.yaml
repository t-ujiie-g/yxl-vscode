# Every geometry `docs/spec.md` §18 names, which upstream's own `shapes.yxl.yaml`
# tries five of. The twelve the Excel backend refused before yxl 0.4.0 are the
# reason this is here: a geometry the compiler takes and this editor does not is
# a spec a reader cannot open.
#
# Each carries a size, a fill and a line, so the sheet is also what a reader
# looks at to see the outlines — one with neither fill nor line draws nothing,
# in Excel and here (`docs/spec.md` §18).
sheets:
  - name: Shapes
    columns:
      - { at: A-N, width: 11 }
    shapes:
      - at: B2
        kind: rectangle
        text: rectangle
        size: { width: 110, height: 70 }
        fill: "DCE9F5"
        line: "1F77B4"

      - at: E2
        kind: rounded_rectangle
        text: rounded_rectangle
        size: { width: 110, height: 70 }
        fill: "DCE9F5"
        line: "1F77B4"

